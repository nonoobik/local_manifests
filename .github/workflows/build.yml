name: Build LineageOS 20 (X6716)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Configure 16G Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h
          sudo mkdir -p /mnt/lineage && sudo chown -R $USER:$USER /mnt/lineage

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

      - name: Configure Git & Repo
        run: |
          git config --global user.name "nonoobik"
          git config --global user.email "nonoobik@users.noreply.github.com"
          git config --global color.ui false
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync LineageOS 20 & Device Trees
        run: |
          mkdir -p /mnt/lineage
          cd /mnt/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --git-lfs --depth=1
          mkdir -p .repo/local_manifests
          curl -s https://raw.githubusercontent.com/nonoobik/local_manifests/main/Infinix-X6716.xml -o .repo/local_manifests/Infinix-X6716.xml
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          rm -rf .repo

      - name: Build ROM
        run: |
          cd /mnt/lineage
          export USE_CCACHE=0
          source build/envsetup.sh
          lunch lineage_X6716-userdebug
          mka bacon -j$(nproc --all)

      - name: Upload ROM to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ github.run_number }}
          name: LineageOS 20.0 for Infinix X6716 (#${{ github.run_number }})
          files: |
            /home/runner/android/lineage/out/target/product/X6716/lineage-*.zip
            /home/runner/android/lineage/out/target/product/X6716/boot.img
            
